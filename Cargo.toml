[package]
name = "lint"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Linters and formatters for Atelier: ESLint, Oxlint, Ruff, Prettier, Oxfmt and more"
repository = "https://github.com/atelier-ide-org/plugin-lint"
publish = false

[lib]
# A dynamic library the IDE loads (lint.dll, liblint.so…), and an ordinary one for the
# tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The interface 0.5: documents, problems and formatting (`lints`, `formats`).
atelier-plugin-api = { git = "https://github.com/atelier-ide-org/api", branch = "lint" }
serde_json = "1"

# A workspace of its own: the plugin builds alone, against the interface only.
[workspace]

[profile.release]
lto = "thin"
strip = true
